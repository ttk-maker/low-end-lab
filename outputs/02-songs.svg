 SC&quot;, sans-serif" font-size="11" font-weight="400">本地运行</text><text x="228" y="109.91" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" letter-spacing="2px">START WITH A SONG</text><text x="228" y="144.46" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="27" font-weight="650" letter-spacing="-0.5px">从喜欢的音乐开始。</text><text x="228" y="170.54" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">先学会一个小段落，再把它放回整首歌。</text><rect x="228" y="340.39" width="1180" height="1" rx="0" fill="rgb(53, 67, 58)"/><rect x="228" y="225.39" width="90" height="90" rx="8" fill="rgb(50, 75, 48)"/><text x="248.91" y="284.72" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="32" font-weight="800">NP</text><text x="328" y="257.77" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700">Night Pocket</text><text x="328" y="279.51" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400">原创练习 · A 小调 · 92 BPM · 20 小节</text><text x="328" y="300.31" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400">练习：根音、五度、半音连接与段落变化</text><rect x="1320" y="249.39" width="88" height="42" rx="8" fill="rgb(213, 245, 139)"/><rect x="1320.5" y="249.89" width="87" height="41" rx="8" fill="none" stroke="rgb(213, 245, 139)" stroke-width="1"/><text x="1334" y="277.54" fill="rgb(21, 32, 18)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="700">继续练习</text><text x="228" y="398.97" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700">带上你自己的歌</text><text x="228" y="436.34" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">这一版可以本地试听音频。自动识别段落、和弦与原曲同步编配尚未实现；工作台始终使用明确标</text><text x="228" y="460.34" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">注的原创示例。</text><rect x="228.5" y="485.69" width="147" height="41" rx="8" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="242" y="513.34" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">选择本地音频试听</text></svg>