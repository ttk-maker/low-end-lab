<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200"><title>LOW END LAB — editable vector UI snapshot</title><desc>Static design export from the verified local prototype; no Figma component semantics.</desc><rect x="0" y="0" width="1440" height="1200" rx="0" fill="#111715"/><rect x="195" y="0" width="1" height="1200" rx="0" fill="rgb(53, 67, 58)"/><text x="20" y="49.39" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="800" letter-spacing="1.8px">LOW END</text><text x="20" y="72.19" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="800" letter-spacing="1.8px">LAB.</text><text x="20" y="96.69" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="10" font-weight="400" letter-spacing="2px">把乐理弹出来</text><rect x="20" y="129.59" width="155" height="48" rx="8" fill="rgb(44, 59, 42)"/><text x="32" y="160.31" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">01</text><text x="60" y="160.74" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">我的歌曲</text><text x="32" y="215.31" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">02</text><text x="60" y="215.74" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">练习工作台</text><text x="32" y="270.31" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">03</text><text x="60" y="270.74" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&