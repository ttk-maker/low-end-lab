<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200"><title>LOW END LAB — editable vector UI snapshot</title><desc>Static design export from the verified local prototype; no Figma component semantics.</desc><rect x="0" y="0" width="1440" height="1200" rx="0" fill="#111715"/><rect x="195" y="0" width="1" height="1200" rx="0" fill="rgb(53, 67, 58)"/><text x="20" y="49.39" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="800" letter-spacing="1.8px">LOW END</text><text x="20" y="72.19" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="800" letter-spacing="1.8px">LAB.</text><text x="20" y="96.69" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="10" font-weight="400" letter-spacing="2px">把乐理弹出来</text><text x="32" y="160.31" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">01</text><text x="60" y="160.74" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">我的歌曲</text><text x="32" y="215.31" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">02</text><text x="60" y="215.74" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">练习工作台</text><text x="32" y="270.31" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">03</text><text x="60" y="270.74" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">指板实验室</text><rect x="20" y="294.59" width="155" height="48" rx="8" fill="rgb(44, 59, 42)"/><text x="32" y="325.31" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">04</text><text x="60" y="325.74" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">学习记录</text><text x="20" y="1078.97" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">SESSION / 001</text><text x="20" y="1098.16" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">一首歌，一次新发现。</text><rect x="20" y="1116.63" width="155" height="1" rx="0" fill="rgb(53, 67, 58)"/><text x="20" y="1146.35" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">四弦贝斯 · E A D G</text><text x="20" y="1165.53" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">学习原型 v0.2</text><rect x="196" y="67" width="1244" height="1" rx="0" fill="rgb(53, 67, 58)"/><text x="228" y="40.65" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">学习记录</text><rect x="1244.5" y="20.2" width="87" height="26.59" rx="20" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="1255" y="38.61" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400">原创教学示例</text><rect x="1342.5" y="20.2" width="65" height="26.59" rx="20" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="1353" y="38.61" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400">本地运行</text><text x="228" y="109.91" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" letter-spacing="2px">MAKE IT YOURS</text><text x="228" y="144.46" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="27" font-weight="650" letter-spacing="-0.5px">把今天的发现，带到下一首歌。</text><text x="228" y="170.54" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">学习记录来自自评；没有录音分析分数。</text><text x="228" y="235.07" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="28" font-weight="400">0</text><text x="228" y="259.91" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">已记录自评</text><text x="323" y="235.07" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="28" font-weight="400">92</text><text x="323" y="259.91" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400">当前练习 BPM</text><text x="228" y="308.52" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">完成一次两小节跟弹后，在工作台记录自己的感受。</text><rect x="228" y="313.38" width="380" height="1" rx="0" fill="rgb(53, 67, 58)"/><text x="228" y="350.29" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" letter-spacing="2px">01 / 和声</text><text x="228" y="388.55" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700">先找到和弦的骨架</text><text x="228" y="420.3" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400">试弹 A1（E 弦 5 品）→ E2（A 弦 7 品），再回到 A1。</text><rect x="228.5" y="442.06" width="102" height="41" rx="8" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="242" y="469.71" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">打开知识卡</text><rect x="628" y="313.38" width="380" height="1" rx="0" fill="rgb(53, 67, 58)"/><text x="628" y="350.29" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" letter-spacing="2px">02 / 连接</text><text x="628" y="388.55" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700">从下一拍，倒推连接音</text><text x="628" y="420.3" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400">Am7 → Fmaj7：在 4&amp; 轻弹 E1，下一小节第一拍落 F1。E 也是</text><text x="628" y="441.09" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400">Am7 的五度。</text><rect x="628.5" y="462.86" width="102" height="41" rx="8" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="642" y="490.51" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">打开知识卡</text><rect x="1028" y="313.38" width="380" height="1" rx="0" fill="rgb(53, 67, 58)"/><text x="1028" y="350.29" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" letter-spacing="2px">03 / 节奏</text><text x="1028" y="388.55" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700">休止，也是贝斯线的一部分</text><text x="1028" y="420.3" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400">音高不变，对比短音与长音，再将一个格子改为休止。</text><rect x="1028.5" y="442.06" width="102" height="41" rx="8" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="1042" y="469.71" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">打开知识卡</text><rect x="228" y="546.36" width="380" height="1" rx="0" fill="rgb(53, 67, 58)"/><text x="228" y="583.27" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" letter-spacing="2px">04 / 转位</text><text x="228" y="621.53" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700">低音不一定是根音</text><text x="228" y="653.28" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400">对比 C–C/E–F：让贝斯先走 C、E、F，听低音的方向。</text><rect x="228.5" y="675.05" width="102" height="41" rx="8" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="242" y="702.7" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">打开知识卡</text><rect x="628" y="546.36" width="380" height="1" rx="0" fill="rgb(53, 67, 58)"/><text x="628" y="583.27" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" letter-spacing="2px">05 / 指板</text><text x="628" y="621.53" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700">同一个音，换个位置</text><text x="628" y="653.28" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400">依次弹 E5、A0、G2；辨认哪个是高八度。</text><rect x="628.5" y="675.05" width="102" height="41" rx="8" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="642" y="702.7" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">打开知识卡</text><rect x="1028" y="546.36" width="380" height="1" rx="0" fill="rgb(53, 67, 58)"/><text x="1028" y="583.27" fill="rgb(213, 245, 139)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" letter-spacing="2px">06 / 曲式</text><text x="1028" y="621.53" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700">让段落决定变化</text><text x="1028" y="653.28" fill="rgb(164, 178, 166)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400">相同进行走两轮：第一轮只弹根音，第二轮只在最后一小节变化。</text><rect x="1028.5" y="675.05" width="102" height="41" rx="8" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="1042" y="702.7" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">打开知识卡</text><rect x="228.5" y="739.05" width="160.47" height="41" rx="8" fill="none" stroke="rgb(53, 67, 58)" stroke-width="1"/><text x="242" y="766.7" fill="rgb(237, 243, 233)" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400">导出我的练习 JSON</text></svg>